
name: PFT CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Grant Maven Wrapper permission
        run: chmod +x mvnw

      - name: Build and Test
        run: ./mvnw clean verify

      - name: Build Docker Image
        run: docker build -t pft-api:ci .

      - name: Login to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker Image
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            TAG=dev
          else
            TAG=ghcr-test
          fi
          
          IMAGE=ghcr.io/pphtan165/pft-api:dev
          docker tag pft-api:ci "$IMAGE"

      - name: Push Docker Image
        if: github.event_name == 'push'
        run: |
          if [ "${GITHUB_REF_NAME}" = "dev" ]; then
            TAG=dev
          else
            TAG=ghcr-test
          fi
          
          IMAGE=ghcr.io/pphtan165/pft-api:dev
          docker push "$IMAGE"
